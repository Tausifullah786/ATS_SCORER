[theme]
base = "light"
primaryColor = "#137567"
backgroundColor = "#F4F7F6"
secondaryBackgroundColor = "#EDF3F1"
textColor = "#213832"
font = "sans serif"

[server]
maxUploadSize = 10
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = true
toolbarMode = "minimal"
